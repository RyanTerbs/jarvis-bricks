<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Derek's world</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1433; color: #3a2a1a;
               font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #world { position: fixed; inset: 0; }
  .panel { background: #fbf3e4; border: 2px solid #3a2a1a; border-radius: 14px; box-shadow: 0 3px 0 rgba(58,42,26,.25); }
  #needs { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 12px;
           display: grid; grid-template-columns: 74px repeat(5, 84px); gap: 3px 10px; align-items: center; }
  .who { font-weight: 800; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need { font-size: 11px; font-weight: 700; }
  .need .t { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #3a2a1a; flex: none; }
  .track { height: 6px; background: #e6dccb; border-radius: 9px; overflow: hidden; border: 1px solid rgba(58,42,26,.35); }
  .fill { height: 100%; border-radius: 9px; transition: width .6s; }
  .sep { grid-column: 1 / -1; border-top: 1px dashed rgba(58,42,26,.3); margin: 2px 0; }
  #top-right { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; }
  .pill { padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  #clock { background: #4aa3df; color: #fff; border-color: #1f5f8b; }
  #wx { background: #fbf3e4; }
  @media (max-width: 760px) { #wx { font-size: 12px; padding: 4px 9px; } }
  a.pill { color: #3a2a1a; text-decoration: none; background: #f6b24a; }
  #now { position: fixed; top: 116px; left: 10px; width: 290px; max-height: calc(100vh - 300px); overflow: auto; padding: 10px 12px; font-size: 13px; }
  #now h3 { margin: 0 0 2px; font-size: 14px; }
  #now .small { font-size: 11px; color: #8a7458; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  #now .th { font-style: italic; margin: 4px 0 8px; }
  #now ul { list-style: none; margin: 4px 0 0; padding: 0; }
  #now li { padding: 3px 0; border-top: 1px dashed rgba(58,42,26,.2); }
  #now .x { float: right; cursor: pointer; font-weight: 800; padding: 0 4px; }
  #status { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); max-width: 70vw; text-align: center; }
  #mini { position: fixed; left: 10px; bottom: 10px; width: 150px; height: 150px; border-radius: 50%; border: 2px solid #3a2a1a; cursor: crosshair; background: #3c9ad6; }
  #controls { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #pad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(2, 42px); gap: 4px; }
  #pad button, #follow, #nowbtn { font: 700 16px system-ui; border: 2px solid #3a2a1a; border-radius: 10px; background: #fbf3e4; color: #3a2a1a; cursor: pointer; touch-action: none; }
  #pad button:active { background: #f6b24a; }
  #follow, #nowbtn { font-size: 13px; padding: 6px 12px; border-radius: 99px; }
  #follow.on { background: #e8762b; color: #fff; }
  #hint { position: fixed; bottom: 172px; left: 12px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; }
  #err a { color: #f6b24a; }
  @media (max-width: 760px) {
    #needs { grid-template-columns: 52px repeat(5, 46px); gap: 2px 5px; padding: 5px 7px; top: 54px; }
    .need .t span { display: none; }
    #now { display: none; top: auto; bottom: 130px; width: auto; right: 10px; max-height: 40vh; }
    #now.open { display: block; }
    #mini { width: 104px; height: 104px; }
    #hint { display: none; }
    #status { bottom: 120px; max-width: 90vw; font-size: 12px; }
  }
  @media (min-width: 761px) { #nowbtn { display: none; } }
</style>
</head>
<body>
<div id="world"></div>

<div id="needs" class="panel"></div>
<div id="top-right">
  <span id="wx" class="panel pill" style="display:none"></span>
  <span id="clock" class="panel pill">🕐 …</span>
  <a class="panel pill" href="./">📔 Diary &amp; stats</a>
</div>
<div id="now" class="panel"></div>
<div id="status" class="panel pill">…</div>
<canvas id="mini" width="300" height="300" title="Tap to jump there"></canvas>
<div id="hint">Drag to look · scroll / pinch to zoom · WASD or arrows to roam · tap the map to jump</div>
<div id="controls">
  <button id="nowbtn">📋 Right now</button>
  <button id="follow" class="on">🎯 Follow Derek</button>
  <div id="pad">
    <span></span><button data-d="0,-1">▲</button><span></span>
    <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
  </div>
</div>
<div id="err"><div>The 3D world couldn't start on this device.<br><br><a href="./">Open his status page instead</a></div></div>

<script>
const host = location.hostname, LOCAL = host === "localhost" || host === "127.0.0.1";
let BASE = "data/";
if (host.endsWith(".github.io")) {
  const owner = host.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
  if (repo) BASE = `https://raw.githubusercontent.com/${owner}/${repo}/main/docs/data/`;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);
async function get(name) {
  for (const base of [BASE, "data/"]) {
    try { const r = await fetch(base + name + "?t=" + Date.now()); if (r.ok) return await r.json(); } catch (e) {}
  }
  return null;
}
const ICON = { did: "▸", thought: "💭", noticed: "👀", refused: "✋", woke: "☀️", built: "🏗️", designed: "📐", diary: "📔", bought: "🛒", learned: "🐶", note: "📓", pupidea: "🐶💡" };
const PUP_WANTS = { food: "🦴 food", play: "🎾 to play", walk: "🐾 a walk", beach: "🏖️ the beach", cuddle: "❤️ a cuddle", nap: "💤 a nap", explore: "👃 to sniff around" };
const bar = (label, value, color) => `<div class="need"><div class="t"><i class="dot" style="background:${color}"></i><span>${label}</span></div>
  <div class="track"><div class="fill" style="width:${Math.round(Math.max(0, Math.min(1, value)) * 100)}%;background:${color}"></div></div></div>`;
const mood = (m) => (m > 0.4 ? "😄" : m > 0.1 ? "🙂" : m > -0.2 ? "😐" : "😟");

function render(s, feed, diary, town) {
  const n = s.needs, p = s.pup;
  let h = `<div class="who">Derek ${mood(s.mood)}</div>` +
    bar("Fullness", 1 - n.hunger, "#e8762b") + bar("Energy", 1 - n.rest, "#f2c230") + bar("Company", 1 - n.social, "#e05a8a") +
    bar("Busy hands", 1 - n.tinker, "#2f6fb3") + bar("Wonder", 1 - n.curiosity, "#8e5ad6");
  if (p) {
    const name = p.name || "Puppy";
    h += `<div class="sep"></div><div class="who">🐶 ${esc(name)}</div>` +
      bar("Fullness", 1 - p.needs.hunger, "#e8762b") + bar("Energy", 1 - p.needs.tired, "#f2c230") + bar("Fun", 1 - p.needs.bored, "#3fae4f") +
      bar("Bond", p.bond, "#e05a8a") + bar(`Tricks ${p.learned.length}/6`, p.learned.length / 6, "#2f6fb3");
  }
  $("needs").innerHTML = h;
  const w = s.weather || {};
  if (w.kind) { $("wx").style.display = ""; $("wx").textContent = `${w.emoji} ${w.temp}°C · ${w.season_emoji} ${cap(w.season)}`; $("wx").title = `${cap(w.name)}, ${w.temp}°C, ${w.season}`; }
  $("clock").textContent = "🕐 " + new Date(s.updated).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
  const pupName = p ? (p.name || "the puppy") : "";
  $("status").textContent = s.asleep ? `Derek is asleep${p ? ` · ${cap(pupName)} is curled up at the foot of the bed` : ""}`
    : `Derek is ${s.doing}${p ? ` · ${cap(pupName)} is ${p.doing}` : ""}`;
  const items = (feed || []).filter((e) => e.kind !== "thought").slice(0, 7).map((e) =>
    `<li>${ICON[e.kind] || "•"} ${esc(e.text)}${e.why ? ` <i style="color:#8a7458">“${esc(e.why)}”</i>` : ""}</li>`).join("");
  const d = (diary || [])[0];
  $("now").innerHTML = `<span class="x" onclick="document.getElementById('now').classList.remove('open')">×</span>
    <div class="small">right now · ${esc(String(s.place).replace(/_/g, " "))}${w.kind ? ` · ${esc(w.emoji)} ${esc(w.name)}, ${esc(w.temp)}°C` : ""}</div>
    <h3>${esc(cap(s.asleep ? "asleep" : s.doing))}</h3>
    <div class="th">“${esc(s.asleep ? "Zzz…" : s.thought)}”</div>
    <div class="small">coins ${s.coins}/${s.coins_goal} · bricks ${s.bricks}${town && town.site ? ` · building ${esc(town.site.name)} ${town.site.done}/${town.site.work}` : ""}</div>
    ${p ? `<div class="small" style="margin-top:6px">🐶 ${esc(cap(pupName))}${p.wants ? " wants " + esc(PUP_WANTS[p.wants] || p.wants) : ""}</div>
      <div class="th">“${esc(p.thought || "…")}”</div>` : ""}
    <ul>${items}</ul>
    ${d ? `<div class="small" style="margin-top:8px">last diary · ${esc(d.day)}</div><div><b>${esc(d.title)}</b></div>` : ""}`;
}

async function refresh() {
  const [s, feed, town, diary] = await Promise.all([get("state.json"), get("feed.json"), get("town.json"), get("diary.json")]);
  if (!s) { $("status").textContent = "Can't reach Derek right now"; return; }
  render(s, feed, diary, town);
  window.__last = [s, town];
  if (window.World && town) window.World.update(s, town);
}
refresh();
setInterval(refresh, LOCAL ? 2000 : 60000);
$("nowbtn").onclick = () => $("now").classList.toggle("open");
</script>
<script type="module">
  try {
    const W = await import("./town3d.js");
    W.mount(document.getElementById("world"), { full: true, minimap: document.getElementById("mini") });
    window.World = W;
    if (window.__last && window.__last[1]) W.update(...window.__last);
    const fb = document.getElementById("follow");
    fb.onclick = () => W.follow();
    setInterval(() => fb.classList.toggle("on", W.getMode() === "follow"), 300);
    for (const b of document.querySelectorAll("#pad button")) {
      const [dx, dz] = b.dataset.d.split(",").map(Number);
      const go = (e) => { e.preventDefault(); W.explore(dx, dz); }, stop = () => W.explore(0, 0);
      b.addEventListener("pointerdown", go); b.addEventListener("pointerup", stop);
      b.addEventListener("pointerleave", stop); b.addEventListener("pointercancel", stop);
    }
  } catch (e) {
    console.warn("3D world unavailable:", e);
    document.getElementById("err").style.display = "flex";
  }
</script>
</body>
</html>
